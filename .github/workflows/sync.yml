
name: TIKI Catalogue Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import TIKI products
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python sync.py

      - name: Commit updated catalogue
        run: |
          git config user.name "TIKI Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog.json translations.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatic TIKI catalogue update"
            git push
          fi
